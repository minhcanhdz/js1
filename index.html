<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dang nhap</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body {
  font-family: Arial;
  margin: 30px;
}
table {
  border-collapse: collapse;
}
td {
  border: 1px solid gray;
  padding: 8px;
}
#thongbao {
  color: red;
  font-weight: bold;
}
#ketqua {
  color: green;
  font-weight: bold;
  margin-top: 8px;
}
</style>
</head>
<body>

<table>
  <tr id="dong-user">
    <td>Username</td>
    <td><input type="text" id="username" placeholder="Nhap username"></td>
  </tr>
  <tr id="dong-pass">
    <td>Password</td>
    <td><input type="password" id="password" placeholder="Nhap password"></td>
  </tr>
  <tr>
    <td colspan="2">
      <div id="thongbao"></div>
      <div id="ketqua"></div>
    </td>
  </tr>
  <tr>
    <td colspan="2" align="center">
      <button id="btnLogin">Login</button>
    </td>
  </tr>
</table>

<script>
$(document).ready(function() {
  var daDangNhap = false;

  $("#btnLogin").click(function() {
    if (daDangNhap == false) {
      var u = $("#username").val();
      var p = $("#password").val();

      if (u == "admin" && p == "admin") {
        $("#thongbao").text("");
        $("#dong-user").hide();
        $("#dong-pass").hide();
        $("#ketqua").text("Chuc mung, ban da dang nhap thanh cong!");
        $("#btnLogin").text("Logout");
        daDangNhap = true;
      } else {
        $("#ketqua").text("");
        $("#thongbao").text("Sai thong tin dang nhap !");
      }
    } else {
      $("#username").val("");
      $("#password").val("");
      $("#dong-user").show();
      $("#dong-pass").show();
      $("#ketqua").text("");
      $("#thongbao").text("");
      $("#btnLogin").text("Login");
      daDangNhap = false;
    }
  });
});
</script>

</body>
</html>
